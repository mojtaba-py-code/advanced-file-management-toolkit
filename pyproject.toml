[project]
name = "advanced-file-management-toolkit"
version = "1.0.0"
description = "A security-first command-line toolkit for advanced file management: organize, deduplicate, sync, back up, search, monitor."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Mojtaba Karimi" }]
keywords = ["file-management", "cli", "backup", "deduplication", "sync", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]
dependencies = [
    "PyYAML>=6.0.1",
    "watchdog>=4.0.0",
    "schedule>=1.2.1",
    "colorama>=0.4.6",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff", "mypy", "bandit", "pip-audit"]

[project.urls]
Homepage = "https://github.com/mojtaba-py-code/advanced-file-management-toolkit"
Issues = "https://github.com/mojtaba-py-code/advanced-file-management-toolkit/issues"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["backups", "logs", "reports"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "S",   # bandit-style security checks
    "C4",  # comprehensions
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF002", # en dashes in prose docstrings are intentional typography
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert on internals, use asserts, and touch temp paths.
"tests/*" = ["S101", "S105", "S106", "S108", "SLF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["core", "utils", "database"]
omit = ["tests/*"]

[tool.coverage.report]
# The floor is a ratchet, not a target: line coverage sits at 90%, and the gate
# is set below it so an unrelated refactor does not fail the build while a real
# drop in tested behaviour still does. pytest-cov reads this, so a local
# `pytest --cov` gates on exactly the number CI does. Raise it as coverage rises.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
