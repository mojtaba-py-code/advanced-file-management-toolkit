name: Bug report
description: Something does not behave as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, please do **not** use this form —
        follow [SECURITY.md](../blob/main/SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command you ran. Please run it with `--dry-run` first if it is destructive.
      placeholder: python main.py organize ~/Downloads --strategy category --dry-run
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Toolkit version or commit
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.5"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: From `logs/`, or the console with `--verbose`. Redact any private paths.
      render: shell
