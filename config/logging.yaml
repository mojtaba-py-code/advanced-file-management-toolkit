# Optional standalone logging configuration (dictConfig format).
# The toolkit configures logging programmatically from settings.yaml by
# default; this file is provided for users who prefer declarative logging or
# want to plug the toolkit into an existing logging setup.

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: logs/toolkit.log
    maxBytes: 5242880
    backupCount: 5
    encoding: utf-8

loggers:
  aftk:
    level: DEBUG
    handlers: [console, file]
    propagate: false

root:
  level: WARNING
  handlers: [console]
